<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramesh Kumar | Senior iOS Software Engineer & Team Lead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(16, 24, 40, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.14);
      --cyan: #06b6d4;
      --indigo: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --glow: rgba(6, 182, 212, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(6, 182, 212, 0.05) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(16px);
      background: rgba(7, 11, 20, 0.85);
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
      padding: 1rem 2rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #fff;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--cyan);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-resume {
      padding: 0.5rem 1.1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-resume:hover {
      background: var(--card-hover);
      border-color: var(--cyan);
      color: #fff;
    }

    .btn-resume-highlight {
      border-color: rgba(6, 182, 212, 0.4);
      color: var(--cyan);
      background: rgba(6, 182, 212, 0.08);
    }

    .btn-resume-highlight:hover {
      background: rgba(6, 182, 212, 0.18);
      border-color: var(--cyan);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem;
      position: relative;
      z-index: 1;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 3rem;
      align-items: center;
      min-height: calc(85vh - 70px);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.25);
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      font-size: 0.85rem;
      color: var(--cyan);
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan);
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .code-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .hero p.lead {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 580px;
      margin-bottom: 2rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #fff;
      padding: 0.75rem 1.6rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.3);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      border-top: 1px solid var(--card-border);
      padding-top: 2rem;
    }

    .stat-item dt {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-item dd {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
    }

    .terminal-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .terminal-header {
      background: rgba(255, 255, 255, 0.04);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .terminal-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .terminal-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .terminal-body {
      padding: 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .kw { color: #f43f5e; font-weight: 600; }
    .type { color: #38bdf8; }
    .str { color: #34d399; }
    .prop { color: #fbbf24; }
    .comment { color: #64748b; font-style: italic; }

    .marquee-wrap {
      border-top: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.02);
      overflow: hidden;
      white-space: nowrap;
      padding: 1.2rem 0;
    }

    .marquee-track {
      display: inline-flex;
      gap: 2.5rem;
      animation: marquee 25s linear infinite;
    }

    .marquee-item {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .marquee-item::after {
      content: '◆';
      color: var(--cyan);
      font-size: 0.7rem;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .section-header {
      margin-bottom: 3rem;
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .section-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      border-left: 2px solid rgba(255, 255, 255, 0.08);
      margin-left: 1rem;
      padding-left: 2rem;
    }

    .timeline-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2rem;
      transition: all 0.2s ease;
    }

    .timeline-card:hover {
      border-color: var(--cyan);
      background: rgba(16, 24, 40, 0.9);
      transform: translateX(4px);
    }

    .timeline-card::before {
      content: '';
      position: absolute;
      left: calc(-2rem - 9px);
      top: 2rem;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .timeline-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .role-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .company-sub {
      color: var(--cyan);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .date-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
    }

    .timeline-body ul {
      margin-left: 1.25rem;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    .timeline-body ul li {
      margin-bottom: 0.5rem;
    }

    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: #93c5fd;
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .project-card:hover {
      border-color: rgba(6, 182, 212, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .project-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text);
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    .contact-box {
      background: linear-gradient(135deg, rgba(16, 24, 40, 0.9), rgba(7, 11, 20, 0.95));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 3.5rem 2rem;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

      font-size: 2.25rem;
      margin-bottom:
